{{- if ne .Params.theme "medieval" -}}
<style>
  .canvas-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
  }
</style>

<div class="canvas-container"></div>
{{- $background := resources.Get "threejs/background.js" | minify | fingerprint }}
<script defer type="module" src="{{ $background.Permalink }}"></script>
{{- end -}}
